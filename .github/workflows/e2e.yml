name: E2E Tests

# ファミリー 5 サイトで、a11y を自動検査していなかったのはこのリポだけだった
# (evi / watch は e2e/a11y.spec.ts、okinawa は tests/a11y.spec.ts を持つ)。
# 実際、導入したところトップの CTA ボタンと更新履歴ラベルと省庁凡例で
# コントラスト違反が出た。誰も見ていなかっただけで、無かったわけではない。
#
# a11y.spec.ts は dist/ を走査してページ一覧を作るため、build を先に済ませる
# 必要がある。飛ばすと列挙 0 件になるが、その場合は spec 側で落ちる。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # 律速はテストではなく Playwright / apt のインストール。平常時は 20〜30 秒だが、
    # 2026-08-19 の実測ではファミリー横断で遅延し、portfolio の同じステップが
    # 28.45 分動いてなお完了しなかった(concurrency で cancel)。成功実行でも
    # portfolio 15.35 分 / edu-evidence 13.6 分。テストの実行時間から決めない。
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build site
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
