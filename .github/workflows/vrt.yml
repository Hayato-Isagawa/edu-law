name: VRT

on:
  pull_request:
    branches: [main]
    paths:
      - "src/layouts/**"
      - "src/components/**"
      - "src/styles/**"
      # 描画に効くのに対象外だった経路。edu-evidence #432(h2 のサイズ変更)は
      # src/pages だけの変更だったため VRT が起動せず、見た目が変わるのに
      # ピクセル判定が走らなかった。同じ穴がこのリポにも残っていた。
      #
      # 法令本文・ガイドは src/content にあるので、これらを足しても
      # コンテンツの追記・修正では起動しない。
      - "src/pages/**"
      # 更新履歴は PR ごとに 1 行増える(rule 8)。その描画は VRT の撮影範囲に
      # 残していない(`/changelog` は対象リストに無く、トップの「最近の更新」は
      # リストを隠して撮る。理由は vrt/pages.spec.ts 冒頭)。撮っていないものの
      # 変更で起動しても得るものが無いので、ページとデータの両方を除外する。
      #
      # データ側の除外は src/data/** の後ろに置くこと。paths の否定は後勝ち。
      - "!src/pages/changelog.astro"
      - "src/data/**"
      - "!src/data/changelog.ts"
      - "astro.config.*"
      - "vrt/**"
      - "playwright.vrt.config.ts"
      - ".github/workflows/vrt.yml"
  workflow_dispatch:

concurrency:
  group: vrt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vrt:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Build PR branch
        run: npm run build

      - name: Stash PR build
        run: mv dist dist-pr

      - name: Build main (baseline)
        run: |
          git worktree add /tmp/edu-law-main origin/main
          npm --prefix /tmp/edu-law-main ci
          npm --prefix /tmp/edu-law-main run build
          mv /tmp/edu-law-main/dist dist-main

      - name: Capture baseline from main
        env:
          VRT_DIST: dist-main
        run: npx playwright test --config playwright.vrt.config.ts --update-snapshots

      - name: Compare PR against baseline
        env:
          VRT_DIST: dist-pr
        run: npx playwright test --config playwright.vrt.config.ts

      - name: Upload VRT report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vrt-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
