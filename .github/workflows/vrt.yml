name: VRT

on:
  pull_request:
    branches: [main]
    paths:
      - "src/layouts/**"
      - "src/components/**"
      - "src/styles/**"
      # 描画に効くのに対象外だった経路。edu-evidence #432(h2 のサイズ変更)は
      # src/pages だけの変更だったため VRT が起動せず、見た目が変わるのに
      # ピクセル判定が走らなかった。同じ穴がこのリポにも残っていた。
      #
      # 法令本文・ガイドは src/content にあるので、これらを足しても
      # コンテンツの追記・修正では起動しない。
      - "src/pages/**"
      # 更新履歴は体感の変わる PR ごとに最大 1 行増える
      # (`CONTRIBUTING.md`「changelog を同じ PR で更新する」)。その描画は VRT の
      # 撮影範囲に残していない(`/changelog` は対象リストに無く、トップの
      # 「最近の更新」はリストを隠して撮る。理由は `vrt/targets.mjs` 冒頭)。
      # 撮っていないものの変更で起動しても得るものが無いので除外する。
      - "!src/pages/changelog.astro"
      # **src/data/** は意図的に外してある。** ベースライン側へ運ぶ素材なので
      # (下の Build baseline ステップ、ADR 0027)、ここに残すと「起動はするが構造上
      # ぜったいに差分が出ない」トリガになり、5 分前後の CI を空回りさせる。
      # 以前は src/data/** を載せて changelog.ts だけ打ち消していたが、運ぶ側に
      # 移したので打ち消しも不要になった。
      #
      # 代償として、scenes.ts の中の**ロジック**(getAllScenes / getSceneIndex)の変更は
      # VRT から見えなくなる。データとロジックを別ファイルに割ればロジック側をここへ戻せる。
      - "astro.config.*"
      # 依存の更新も描画を変える。Tailwind / Astro の週次 bump は package.json と
      # package-lock.json しか触らないので、ここに載せないと VRT が一度も走らない。
      # lock はキャレット指定の範囲内の更新も拾うので、package.json より広い。
      #
      # **ただし gate にはならない。** VRT は required check ではなく
      # (required は "Build site" のみ)、dependabot-auto-merge.yml の
      # `gh pr merge --auto` は required しか待たない。Build site は 31〜47 秒、
      # VRT は 6 分前後かかる(4 projects)ので、非 major の bump は VRT の結果が出る前に
      # マージされる。得られるのは事後に差分画像が残ることだけ。
      - "package-lock.json"
      - "vrt/**"
      - "playwright.vrt.config.ts"
      - ".github/workflows/vrt.yml"
  workflow_dispatch:
    inputs:
      neutral:
        description: "ベースラインに PR のコンテンツを持ち込む(既定)。false にすると main そのままで撮る"
        type: boolean
        default: true

concurrency:
  group: vrt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vrt:
    name: Visual Regression
    runs-on: ubuntu-latest
    # 律速はテストではなく Playwright / apt のインストール。平常時は 20〜30 秒だが、
    # 2026-08-19 の実測ではファミリー横断で遅延し、portfolio の同じステップが
    # 28.45 分動いてなお完了しなかった(concurrency で cancel)。成功実行でも
    # portfolio 15.35 分 / edu-evidence 13.6 分。テストの実行時間から決めない。
    timeout-minutes: 45
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Build PR branch
        run: npm run build

      - name: Stash PR build
        run: mv dist dist-pr

      # ベースラインは「main のコード x PR のコンテンツ」で撮る。描画に入る素材の
      # 側を PR に揃えると、比較に残る差分がコード由来だけになる(ADR 0027)。
      # 揃えないと、他ファイルの法令・ガイド修正が波及しただけの赤が出続ける。
      - name: Build baseline (main code x PR content)
        id: baseline
        env:
          # pull_request では github.event.inputs が無いので 'true' に落ちる。
          # `inputs.neutral == false` と書かないこと — GitHub の式は型が違うと
          # 数値に寄せるので、null と false が等しくなって既定が反転する。
          VRT_NEUTRAL: ${{ github.event.inputs.neutral || 'true' }}
        run: |
          set -euo pipefail
          git worktree add /tmp/edu-law-main origin/main
          npm --prefix /tmp/edu-law-main ci

          if [ "$VRT_NEUTRAL" = "false" ]; then
            echo "::notice title=VRT baseline raw::neutral=false: main そのままでベースラインを撮る。コンテンツ由来の差分も出る"
            npm --prefix /tmp/edu-law-main run build
            # 他の 2 経路と同じく mode を先に書く。mv が落ちたときだけ相が
            # 空になる、という非対称を作らない。
            echo "mode=raw" >> "$GITHUB_OUTPUT"
            mv /tmp/edu-law-main/dist dist-main
            exit 0
          fi

          # 運ぶ素材の allowlist。**ここに無いものは運ばない**:
          #   - src/pages / src/components / src/layouts / src/styles /
          #     astro.config.* — 検査対象そのもの
          #   - package.json / package-lock.json — 依存バンプの視覚影響は VRT が
          #     見るべきもの(edu-evidence ADR 0027 が Astro 7 移行を VRT で検証した)。上の
          #     paths に lock を載せているのはそのため
          #   - public/ — `find src/content -type f ! -name "*.md"` が 0 件で、
          #     コンテンツ編集者が画像を持ち込む経路が無い。public にあるのは
          #     ブランド資産(logo.svg / og-image.png / favicon)と配信設定
          #     (_headers / _redirects / robots.txt)で、いずれもコード側
          #
          # --delete は必須。PR が消した md が main 側に残ると、消えたはずの
          # カードがベースラインにだけ描かれて、それ自体が差分になる。
          rsync -a --delete src/content/ /tmp/edu-law-main/src/content/
          rsync -a --delete src/data/ /tmp/edu-law-main/src/data/
          # スキーマはコンテンツと同伴させる。別々にすると PR のフロントマターを
          # main の zod が弾いてビルドが落ちる。
          cp src/content.config.ts /tmp/edu-law-main/src/content.config.ts

          # **|| はビルドコマンドだけに掛ける。** 上の npm ci や rsync まで巻き込むと、
          # ネットワーク断・disk full・pagefind の異常終了が「degraded で続行」に
          # 落ちて、インフラ障害が緑で通る。
          build_rc=0
          npm --prefix /tmp/edu-law-main run build || build_rc=$?

          if [ "$build_rc" -ne 0 ]; then
            echo "::warning title=VRT baseline degraded::main のコードで PR のコンテンツをビルドできなかった。main 自身のコンテンツで撮り直す。この run の差分にはコンテンツ由来の差分が混ざる"
            git -C /tmp/edu-law-main checkout -- .
            git -C /tmp/edu-law-main clean -fd
            # git clean は -x が無いと gitignore 済みを消さない。Astro の content
            # layer キャッシュが残ると、撮り直しに PR のコンテンツが混入する。
            rm -rf /tmp/edu-law-main/dist /tmp/edu-law-main/.astro \
                   /tmp/edu-law-main/node_modules/.astro /tmp/edu-law-main/node_modules/.vite
            # ここで落ちたら main 自体が壊れている。set -e で job を落とす。
            npm --prefix /tmp/edu-law-main run build
            echo "mode=degraded" >> "$GITHUB_OUTPUT"
          else
            echo "mode=neutral" >> "$GITHUB_OUTPUT"
          fi

          mv /tmp/edu-law-main/dist dist-main

      # 比較の前に置く。後ろに置くと if: always() が要るうえ、比較ステップが
      # クラッシュした回に書かれない。
      - name: Report baseline mode
        env:
          MODE: ${{ steps.baseline.outputs.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in
            neutral)
              cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### VRT ベースライン: neutral (main のコード x PR のコンテンツ)

          差分はコード / CSS 由来。ただし `.astro` に直接書かれた散文・数値は、
          実体がコンテンツでも中立化されない (ADR 0027)。
          EOF
              ;;
            degraded)
              cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### VRT ベースライン: degraded (コンテンツ中立化に失敗)

          main のコードで PR のコンテンツをビルドできなかった。PR が
          `src/content.config.ts` か `src/data/` の形を変えていて、main のページが
          それを前提にしていない可能性が高い。

          **この run の差分にはコンテンツ由来の差分が混ざる。赤を見た目の回帰として読まないこと。**
          EOF
              ;;
            *)
              cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### VRT ベースライン: raw (main そのまま)

          コンテンツ由来の差分も出る。手動実行で neutral=false を選んだとき用。
          EOF
              ;;
          esac

      - name: Capture baseline from main
        env:
          VRT_DIST: dist-main
        run: npx playwright test --config playwright.vrt.config.ts --update-snapshots

      - name: Compare PR against baseline
        env:
          VRT_DIST: dist-pr
        run: npx playwright test --config playwright.vrt.config.ts

      - name: Upload VRT report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # 赤い run で人が実際にクリックするのは artifact であって summary では
          # ないので、相を名前にも出す。
          #
          # **三項で「neutral のときだけ素の名前」にはできない。** GitHub の式は
          # 空文字を falsy として扱うので、`X == 'neutral' && '' || format(...)` は
          # 常に右辺を返す。常時サフィックスにして、ベースラインステップが mode を
          # 書く前に落ちた run も名前で分かるようにする。
          name: vrt-report-${{ steps.baseline.outputs.mode || 'nobaseline' }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
