name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # .claude/hooks/ の frontmatter 不変性ガードは、壊れても例外を出さず
      # 素通りするだけなので失敗が見えない。フックは dist に入らないため
      # e2e も vrt も届かず、link-check は誤った法令 ID にも 200 を返す。
      # 「ガードが止めるはずだった改変」が公開された後でしか気づけないので、
      # required check である Build site の中に載せる。ネットワーク不要で数百 ms。
      - name: Hook regression tests
        run: npm run test:hooks

      - name: Design token conventions
        if: ${{ !cancelled() }}
        run: npm run check:tokens

      # astro check は errors でのみ非ゼロ終了する(既定の minimumFailingSeverity=error)。
      # 現在 hints が 22 件あるが落ちない。build より前に置いて、型が壊れている
      # ときはビルド成果物を作る前に止める。
      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
