name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Design token conventions
        run: npm run check:tokens

      # astro check は errors でのみ非ゼロ終了する(既定の minimumFailingSeverity=error)。
      # 現在 hints が 22 件あるが落ちない。build より前に置いて、型が壊れている
      # ときはビルド成果物を作る前に止める。
      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # link-check.yml の通知分岐。**壊れても静かに壊れる** — lychee は走り、レポートも
      # アーティファクトに残り、job も緑のまま「通知だけ」が消える。姉妹リポ
      # okinawa-in-data では open な Issue があると後続の検出を捨てており、2026-08-17 に
      # 見つかった 404 が 2 日間どこにも出なかった(okinawa-in-data#107 / #110。
      # このリポも同じコードを共有していた)。
      # ワークフローに埋まっている run: ブロックを取り出し、gh をスタブして
      # 「誰に」「何を」届けたかまで見る。シェルからは見えない YAML の配線
      # (通知ステップに continue-on-error が無いこと等)も併せて固定している。
      - name: Workflow logic regression tests
        if: ${{ !cancelled() }}
        run: npm run test:workflows

      # .claude/hooks/ の frontmatter 不変性ガードは、壊れても例外を出さず
      # 素通りするだけなので失敗が見えない。フックは dist に入らないため
      # e2e も vrt も届かず、link-check は誤った法令 ID にも 200 を返す。
      # 「ガードが止めるはずだった改変」が公開された後でしか気づけないので、
      # ジョブ Build site の中に載せる。ネットワーク不要で数百 ms。
      #
      # Build より後ろに置き、自分自身に `!cancelled()` を付ける(姉妹リポ edu-watch と
      # 同じ形)。前に置くと、フックテストが 1 本落ちただけで Type check と
      # Build がスキップされ、「サイトがビルドできるか」が分からなくなる。
      # 以降のガード 2 本も同じ理由でここに並べている。
      - name: Hook regression tests
        if: ${{ !cancelled() }}
        run: npm run test:hooks

      # 公式解説の書名は frontmatter と本文末尾の `## 出典` 節に**独立して 2 箇所**
      # 書かれている。片方だけ直したずれは astro check も e2e も週次 link-check も
      # 通り、表示も正常に出る(2026-08-25 に本番へ出て、公開 URL を人手で
      # 2 値判定するまで気づけなかった。#190 / #191)。ネットワーク不要で数十 ms。
      - name: Source title consistency
        if: ${{ !cancelled() }}
        run: npm run check:sources

      # check:sources 自身の回帰テスト。書名のずれを見つける側も「赤になるべきときに
      # 赤になる」ことは自分では観測できない(素通りに落ちても出力は緑と区別がつかない)。
      # 検査の各経路と、npm script / この workflow への配線までを固定する。
      - name: Content guard regression tests
        if: ${{ !cancelled() }}
        run: npm run test:content
